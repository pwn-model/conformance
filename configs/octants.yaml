# Conformance config of the octant model variant: the documented model
# parameters (as in the config generated by scripts/params_to_config.py from
# model-spec/parameters.yaml), with the attraction and movement systems
# replaced by their octant counterparts, which take the same parameters:
# TreeAttraction -> TreeAttractionOctants, BeetleMovement -> BeetleMovementOctants.
#
# Unlike the default config, this one is not generated: keep its parameter
# values in sync with model-spec/parameters.yaml by hand.

seed: 1
resources:
- type: WorldSize
  width: 4000
  height: 3000
  cell_size: 10
systems:
- type: InitGrids
- type: InitTrees
  km2_probability: 0.6
  tree_probability: 0.9
  damage_prevalence: 0.03
  beetle_prevalence: 0.2
- type: UpdateTime
  ticks_per_year: 52
- type: DiseaseCourse
  ticks_to_damage: 8
- type: RandomRelease
  tick_of_infection: 0
  num_trees: 10
- type: DamageTrees
  tick_of_year: 35
  damage_probability: 0.01
  removal_probability: 0.333
- type: BeetleEmergence
  tick_of_year: 19
  beetles_per_tree: 5
  life_expectancy: 5
  max_age: 18
- type: TreeAttractionOctants
  tick_of_year: 18
  damaged_trees: true
  half_distance: 50
  density_radius: 20
  density_weight: 1.0
- type: TreeAttractionOctants
  tick_of_year: 18
  damaged_trees: false
  half_distance: 50
  density_radius: 20
  density_weight: 1.0
- type: BeetleMovementOctants
  steps_per_tick: 7
  distance_per_step: 2000
  duration_feeding: 3
  feeding_probability: 0.5
  leave_tree_probability: 0.25
  emergence_flight_distance: 100
- type: BeetleMortality
- type: Colonization
  tick_of_year: 20
  cell_size: 100
  kernel_half_distance: 50
  kernel_radius: 300
  beetles_per_tree: 2.0
  trees_per_beetle: 1.0
- type: NematodeInfection
  infection_probability: 0.02
- type: FixedTermination
  steps: 5200
- type: CSV
  observer:
    type: TreePopulation
  file: tree_pop.csv
- type: CSV
  observer:
    type: TreeColonization
  file: tree_col.csv
- type: CSV
  observer:
    type: TreeDamage
  file: tree_damage.csv
